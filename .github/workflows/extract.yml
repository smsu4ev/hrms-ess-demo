name: Extract app archive to repo root

on:
  push:
    paths:
      - '.github/workflows/extract.yml'

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Unzip hrms-ess-v2 into repo root
        run: |
          set -e
          unzip -o hrms-ess-v2.zip -d /tmp/appzip
          shopt -s dotglob nullglob
          TOPDIR="$(ls /tmp/appzip)"
          echo "Top-level folder: $TOPDIR"
          mv /tmp/appzip/"$TOPDIR"/* .
          rm -rf /tmp/appzip hrms-ess-v2.zip .github/workflows/extract.yml

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract hrms-ess-v2 app files to repo root" || echo "nothing to commit"
          git push
