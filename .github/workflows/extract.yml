# One-shot extraction: unpack hrms-ess-v2.zip into repo root (demo deploy helper).
# Triggers on push (including this workflow file's own commit), runs once, then
# deletes itself along with the zip so the repo keeps only the app files.
name: Extract hrms-ess-v2 app files to repo root

on: push

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip contents to repo root
        run: |
          set -euxo pipefail
          if [ ! -f hrms-ess-v2.zip ]; then
            echo "No hrms-ess-v2.zip found; nothing to extract."
            exit 0
          fi
          mkdir -p /tmp/extract
          unzip -q hrms-ess-v2.zip -d /tmp/extract
          SRC=/tmp/extract
          if [ -d "$SRC/hrms-ess-v2" ]; then SRC="$SRC/hrms-ess-v2"; fi
          cp -rf "$SRC"/. .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes after extraction."
          else
            git commit -m "Extract hrms-ess-v2 app files to repo root"
          fi
      - name: Remove zip and workflow (one-shot)
        run: |
          rm -f hrms-ess-v2.zip .github/workflows/extract.yml
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to remove."
          else
            git commit -m "Remove hrms-ess-v2.zip and one-shot extract workflow"
          fi
          git push origin HEAD:main
